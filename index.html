<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>出馬表の入口</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1f2328;--mut:#5c6370;--line:#dedbd2;--acc:#1f6f43;--acc-ink:#fff;--warn:#8a5a00;--warn-soft:#fff4dc}
@media (prefers-color-scheme:dark){:root{--bg:#16181b;--card:#1f2226;--ink:#e8e6e1;--mut:#a3a8b0;--line:#33373d;--acc:#5fbf86;--acc-ink:#0d1a12;--warn:#f0c062;--warn-soft:#3a2e14}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 system-ui,-apple-system,"Hiragino Sans","Yu Gothic UI",sans-serif}
main{max-width:520px;margin:0 auto;padding:40px 16px}
h1{font-size:22px;margin:0 0 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px}
#status{margin:0 0 12px;font-weight:700}
#status.off{color:var(--warn)}
a.go{display:inline-block;background:var(--acc);color:var(--acc-ink);text-decoration:none;font-weight:700;border-radius:10px;padding:10px 18px}
a.go[hidden]{display:none}
.hint{color:var(--mut);font-size:14px;margin:16px 0 0}
.when{color:var(--mut);font-size:13px;margin:8px 0 0;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<main>
  <h1>出馬表</h1>
  <div class="box">
    <p id="status" role="status">確かめています…</p>
    <a class="go" id="go" hidden>出馬表を開く</a>
    <p class="when" id="when"></p>
    <p class="hint">開くと、メールアドレスの確認があります。登録してもらったアドレスを入れて、メールに届いた番号を入れてください(開催日ごとに1回)。</p>
    <p class="hint">このページをブックマークしておけば、毎回ここから開けます。</p>
  </div>
</main>
<script>
(function () {
  var st = document.getElementById("status"), go = document.getElementById("go"), when = document.getElementById("when");
  function off(t) { st.textContent = t; st.className = "off"; }
  fetch("link.json?t=" + Date.now(), {cache: "no-store"}).then(function (r) { return r.json(); }).then(function (d) {
    if (d.updated) when.textContent = "最終更新 " + d.updated;
    // 丸1日以上書き換わっていなければ、配信が止まったまま(パソコンが切れたなど)とみなす
    var age = d.updated ? (Date.now() - new Date(d.updated.replace(" ", "T") + ":00+09:00").getTime()) / 36e5 : 99;
    if (!d.url || age > 24) { off(d.url ? "今は配信していません。開催日の朝にまた開いてください。" : (d.note || "今は配信していません。")); return; }
    st.textContent = "その日の出馬表へ移動しています…";
    go.href = d.url; go.hidden = false;
    location.replace(d.url);
  }).catch(function () { off("読み込めませんでした。少し待ってから、もう一度開いてください。"); });
})();
</script>
</body>
</html>
